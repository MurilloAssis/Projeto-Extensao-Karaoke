spring:
  application:
    name: karaoke-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/karaoke_apache?connectionTimeZone=UTC}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

karaoke:
  fila:
    limite-pedidos: ${KARAOKE_LIMITE_PEDIDOS:5}
  reprodutor:
    chave: ${PLAYER_API_KEY:teste}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html
