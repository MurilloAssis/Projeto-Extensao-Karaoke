<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:">
    <script src="painel.js" defer></script>
    <title>Apache Gru Rock Bar - TV Player Electron</title>
    <style>
        :root {
            --bg-stage: #0B0E14;
            --bg-panel: #121722;
            --bg-card: #1C2230;
            --bg-card-playing: #112236;
            --apache-red: #D91C24;
            --apache-blue: #1A4B84;
            --cyan-glow: #00A8E8;
            --text-white: #F4F6F9;
            --text-muted: #9BA3B0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-stage);
            /* Fundo com iluminação sutil de palco (vermelho/azul) igual ao mockup */
            background-image:
                radial-gradient(circle at 35% 15%, rgba(217, 28, 36, 0.16), transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(26, 75, 132, 0.22), transparent 50%);
            color: var(--text-white);
            display: flex;
            flex-direction: row;
            align-items: stretch;
            padding: 16px;
            gap: 16px;
        }

        /* ==========================================================================
       1. COLUNA ESQUERDA: LOGO APACHE GRU + TRELIÇA DE PALCO (FLEX COLUMN)
       ========================================================================== */
        .left-truss-pillar {
            width: 96px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .brand-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 12px;
            z-index: 2;
        }

        .brand-logo {
            width: 150px;
            height: 150px;
            object-fit: fill;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.8));
        }

        /* Estrutura metálica de palco (Truss) embaixo do logo */
        .stage-truss {
            flex: 1;
            width: 58px;
            border-left: 5px solid #2A303D;
            border-right: 5px solid #2A303D;
            background:
                linear-gradient(45deg, transparent 46%, #252B38 47%, #252B38 53%, transparent 54%),
                linear-gradient(-45deg, transparent 46%, #252B38 47%, #252B38 53%, transparent 54%);
            background-size: 100% 54px;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.85);
            opacity: 0.85;
        }

        /* ==========================================================================
       2. ÁREA CENTRAL: MOLDURA DO PLAYER DO YOUTUBE (FLEX GROW)
       ========================================================================== */
        .center-stage-area {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Moldura com borda vermelha e tracejado luminoso idêntica à imagem */
        /* Moldura em 16:9 (formato dos vídeos), o maior possível sem passar da altura da tela */
        .youtube-frame-border {
            flex: none;
            width: min(100%, calc((100vh - 52px) * 16 / 9));
            aspect-ratio: 16 / 9;
            display: flex;
            flex-direction: column;
            background-color: #05070A;
            border: 2px solid var(--apache-red);
            outline: 2px dashed rgba(217, 28, 36, 0.55);
            outline-offset: 4px;
            border-radius: 6px;
            box-shadow: 0 0 28px rgba(217, 28, 36, 0.25);
            overflow: hidden;
            position: relative;
        }

        /* Este elemento #video-mount-area serve de referência exata (getBoundingClientRect)
       para o main.js posicionar a BrowserView do YouTube por cima */
        .video-mount-area {
            flex: 1;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, #141A26 0%, #05070A 100%);
            text-align: center;
            padding: 30px;
            gap: 16px;
        }

        /* Tela de Descanso (visível quando a fila está vazia e a BrowserView é ocultada) */
        .idle-standby-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            opacity: 0.4;
        }

        .idle-standby-content[hidden] {
            display: none;
        }

        .idle-standby-content.com-qr {
            opacity: 1;
        }

        .idle-qr {
            width: min(220px, 26vh);
            height: min(220px, 26vh);
        }

        .idle-qr[hidden] {
            display: none;
        }

        .idle-codigo {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 4px;
            color: var(--text-white);
        }

        .idle-aviso {
            max-width: 520px;
            background: rgba(217, 28, 36, 0.18);
            border: 1px solid var(--apache-red);
            border-radius: 10px;
            padding: 10px 16px;
            font-size: 14px;
            color: #FCA5A5;
        }

        .idle-aviso[hidden] {
            display: none;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .conexao {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.6px;
            color: var(--apache-red);
            white-space: nowrap;
        }

        .conexao.offline {
            color: var(--text-muted);
        }

        .queue-empty {
            font-size: 14px;
            color: var(--text-muted);
            padding: 10px 2px;
        }

        .qr-box.qr-fechado {
            background-color: #1C2230;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 700;
            text-align: center;
        }

        .idle-standby-content h2 {
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--text-white);
        }

        .idle-standby-content p {
            font-size: 16px;
            color: var(--text-muted);
        }

        /* ==========================================================================
       3. COLUNA DIREITA: FILA DE REPRODUÇÃO + PRÓXIMO ROCKSTAR (FLEX COLUMN)
       ========================================================================== */
        .right-queue-sidebar {
            width: 390px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 14px;
        }

        /* Painel Superior: Fila de Reprodução */
        .queue-panel {
            flex: 1;
            background-color: rgba(18, 23, 34, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow: hidden;
        }

        .panel-title {
            font-size: 19px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-white);
        }

        /* Card "Cantando Agora" com borda azul iluminada */
        .now-playing-card {
            background-color: var(--bg-card-playing);
            border: 1.5px solid var(--cyan-glow);
            box-shadow: 0 0 16px rgba(0, 168, 232, 0.22);
            border-radius: 10px;
            padding: 14px 16px;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .now-playing-left {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .mic-icon-box {
            width: 38px;
            height: 38px;
            border-radius: 8px;
            background: rgba(217, 28, 36, 0.18);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: var(--apache-red);
            font-size: 20px;
        }

        .now-playing-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .now-playing-label {
            font-size: 12px;
            color: var(--text-muted);
        }

        .now-playing-singer {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-white);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Barras de onda sonora vermelhas na direita do card */
        .soundwave {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 3px;
            height: 22px;
            flex-shrink: 0;
        }

        .soundwave span {
            width: 3px;
            background-color: var(--apache-red);
            border-radius: 2px;
            animation: eq-bounce 1s infinite ease-in-out;
        }

        .soundwave span:nth-child(1) {
            height: 45%;
            animation-delay: 0.0s;
        }

        .soundwave span:nth-child(2) {
            height: 95%;
            animation-delay: 0.2s;
        }

        .soundwave span:nth-child(3) {
            height: 65%;
            animation-delay: 0.4s;
        }

        .soundwave span:nth-child(4) {
            height: 100%;
            animation-delay: 0.1s;
        }

        .soundwave span:nth-child(5) {
            height: 50%;
            animation-delay: 0.3s;
        }

        @keyframes eq-bounce {

            0%,
            100% {
                transform: scaleY(0.45);
            }

            50% {
                transform: scaleY(1);
            }
        }

        .queue-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* Lista dos próximos da fila */
        .queue-list {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            list-style: none;
            overflow-y: auto;
            padding-right: 4px;
        }

        .queue-list::-webkit-scrollbar {
            width: 5px;
        }

        .queue-list::-webkit-scrollbar-thumb {
            background: #2E3646;
            border-radius: 4px;
        }

        .queue-item {
            background-color: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 10px 12px;
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 12px;
        }

        .singer-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--apache-blue), var(--apache-red));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: var(--text-white);
            flex-shrink: 0;
            border: 1.5px solid rgba(255, 255, 255, 0.25);
        }

        .queue-item-info {
            display: flex;
            flex-direction: column;
            min-width: 0;
            flex: 1;
        }

        .queue-item-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-white);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Card Inferior: Próximo Rockstar + QR Code */
        .next-rockstar-card {
            height: 145px;
            flex-shrink: 0;
            border-radius: 10px;
            border: 1.5px solid rgba(217, 28, 36, 0.65);
            background:
                radial-gradient(circle at 55% 50%, rgba(26, 75, 132, 0.55), transparent 65%),
                linear-gradient(135deg, #2A0E17 0%, #101829 65%, #0D1320 100%);
            padding: 16px 18px;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
        }

        .next-rockstar-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 4px;
            z-index: 2;
            min-width: 0;
        }

        .next-rockstar-label {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-white);
            opacity: 0.9;
        }

        .next-rockstar-name {
            font-size: 32px;
            font-weight: 900;
            color: #FFFFFF;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .qr-box {
            width: 108px;
            height: 108px;
            background-color: #FFFFFF;
            border-radius: 8px;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            z-index: 2;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6);
        }

        .qr-box img,
        .qr-box svg {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* ==========================================================================
       4. OVERLAY DE ANÚNCIO TTS ("PRÓXIMO ROCKSTAR" EM TELA CHEIA)
       ========================================================================== */
        .tts-announcement-overlay {
            position: fixed;
            inset: 0;
            background: rgba(11, 14, 20, 0.94);
            display: none;
            /* Ativado pelo painel.js (classe .active) quando um cantor é chamado ao palco */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            z-index: 9999;
            text-align: center;
        }

        .tts-announcement-overlay.active {
            display: flex;
        }

        .tts-badge {
            background-color: var(--apache-red);
            color: var(--text-white);
            padding: 8px 24px;
            border-radius: 30px;
            font-size: 20px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .tts-singer-name {
            font-size: 72px;
            font-weight: 900;
            color: #FFFFFF;
            text-transform: uppercase;
            text-shadow: 0 0 30px rgba(217, 28, 36, 0.8);
        }

        .tts-song-title {
            font-size: 30px;
            color: var(--cyan-glow);
            font-weight: 600;
        }
    </style>
</head>

<body>

    <!-- 1. COLUNA ESQUERDA: LOGO OFICIAL + TRELIÇA DE PALCO -->
    <aside class="left-truss-pillar">
        <div class="brand-container">
            <img src="./assets/logo-apache-vetorizado.svg" alt="Apache Gru Rock Bar" class="brand-logo">
            <!-- Fallback visual caso o arquivo PNG ainda não esteja na pasta -->
            <div
                style="display:none; width:82px; height:82px; border-radius:50%; border:3px solid #1A4B84; background:#D91C24; align-items:center; justify-content:center; flex-direction:column; font-weight:900; font-size:13px; text-align:center; line-height:1.1;">
                <span>💀</span>
                <span>APACHE</span>
                <small style="font-size:8px;">ROCK BAR</small>
            </div>
        </div>
        <div class="stage-truss"></div>
    </aside>

    <!-- 2. ÁREA CENTRAL: MOLDURA ONDE A BROWSERVIEW DO YOUTUBE É SOBREPOSTA -->
    <main class="center-stage-area">
        <div class="youtube-frame-border">
            <div class="video-mount-area" id="video-mount-area">
                <div class="idle-standby-content com-qr" id="idle-standby">
                    <h2 id="idle-titulo">Palco Apache Gru</h2>
                    <p id="idle-texto">Conectando…</p>
                    <div class="qr-box idle-qr" id="idle-qr" hidden></div>
                    <span class="idle-codigo" id="idle-codigo"></span>
                    <div class="idle-aviso" id="idle-aviso" hidden></div>
                </div>
            </div>
        </div>
    </main>

    <!-- 3. COLUNA DIREITA: CANTANDO AGORA, FILA E PRÓXIMO ROCKSTAR + QR CODE -->
    <aside class="right-queue-sidebar">

        <!-- Bloco Superior: Fila de Reprodução -->
        <section class="queue-panel">
            <div class="panel-header">
                <h1 class="panel-title">Fila de Reprodução</h1>
                <span class="conexao offline" id="conexao">● CONECTANDO…</span>
            </div>

            <!-- Destaque: Cantando Agora -->
            <div class="now-playing-card">
                <div class="now-playing-left">
                    <div class="mic-icon-box">🎤</div>
                    <div class="now-playing-text">
                        <span class="now-playing-label">Cantando agora:</span>
                        <span class="now-playing-singer" id="current-singer-song">Palco livre</span>
                    </div>
                </div>
                <div class="soundwave" id="soundwave" aria-hidden="true">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>
            </div>

            <span class="queue-subtitle">Próximas pessoas na fila:</span>

            <!-- Lista de próximos cantores (preenchida pelo painel.js) -->
            <ul class="queue-list" id="queue-list"></ul>
        </section>

        <!-- Bloco Inferior: Próximo Rockstar + QR Code -->
        <section class="next-rockstar-card">
            <div class="next-rockstar-info">
                <span class="next-rockstar-label">Próximo Rockstar:</span>
                <span class="next-rockstar-name" id="next-rockstar-name">—</span>
            </div>

            <div class="qr-box qr-fechado" id="qr-code-box"><span>Sessão fechada</span></div>
        </section>

    </aside>

    <!-- 4. OVERLAY "SUBA AO PALCO" (exibido antes de cada vídeo) -->
    <div class="tts-announcement-overlay" id="tts-overlay">
        <div class="tts-badge">🎸 Suba ao Palco, Próximo Rockstar!</div>
        <div class="tts-singer-name" id="tts-singer-name"></div>
        <div class="tts-song-title" id="tts-song-title"></div>
    </div>

</body>

</html>
