# Ambiente completo: MySQL (criado pelos scripts) + API + front React (http://localhost:5174).
# Uso: docker compose up -d --build
services:
  mysql:
    image: mysql:8.4
    container_name: karaoke-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: karaoke_apache
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    ports:
      - "3307:3306"
    volumes:
      - karaoke-mysql-dados:/var/lib/mysql
      - ./MVP/BancoDeDados/scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: ./MVP/api
    container_name: karaoke-api
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:mysql://mysql:3306/karaoke_apache?connectionTimeZone=UTC
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      KARAOKE_LIMITE_PEDIDOS: ${KARAOKE_LIMITE_PEDIDOS:-2}
      PLAYER_API_KEY: ${PLAYER_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      JWT_VALIDITY_MINUTES: ${JWT_VALIDITY_MINUTES:-480}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:5174,https://*.trycloudflare.com}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    ports:
      - "8080:8080"

  # Vite em modo dev; /api e /ws são repassados à API pelo proxy do Vite (vite.config.js)
  front:
    build: ./MVP/karaoke-envio-player
    container_name: karaoke-front
    depends_on:
      - api
    environment:
      API_PROXY_TARGET: http://api:8080
    ports:
      - "5174:5173"

  # Túnel público temporário para testar no celular (HTTPS, sem conta).
  # Uso: docker compose --profile tunel up -d  →  endereço em: docker compose logs tunel
  tunel:
    image: cloudflare/cloudflared:2025.11.1
    container_name: karaoke-tunel
    profiles: ["tunel"]
    command: tunnel --no-autoupdate --url http://front:5173
    depends_on:
      - front

volumes:
  karaoke-mysql-dados:
